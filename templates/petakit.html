<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Petakit Monitor: {{ hpc_host_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .petakit-body { background-color: #1e1e1e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        
        /* Layout */
        .grid-container { display: grid; grid-template-columns: 2fr 1.5fr; gap: 25px; margin-top: 20px; }
        
        /* HTOP Styles */
        .htop-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
        .core-bar { background: #333; height: 30px; border-radius: 4px; position: relative; overflow: hidden; }
        .core-fill { height: 100%; transition: width 0.5s ease; }
        .core-text { position: absolute; width: 100%; text-align: center; line-height: 30px; font-size: 0.75rem; font-weight: bold; color: rgba(255,255,255,0.9); z-index: 2; text-shadow: 0 1px 2px black; }
        
        /* Phase Colors */
        .phase-Deskewing .core-fill { background: linear-gradient(90deg, #0288d1, #26c6da); } /* Blue-Cyan */
        .phase-Cropping .core-fill { background: linear-gradient(90deg, #c2185b, #f48fb1); } /* Pink */
        .phase-Initializing .core-fill { background: #ff9800; }
        
        /* Stats Card */
        .stats-card { background: #2d2d2d; border-radius: 12px; padding: 25px; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .big-number { font-size: 4rem; font-weight: 700; color: white; line-height: 1; margin-bottom: 5px; }
        .stat-label { font-size: 0.9rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        
        .metric-row { display: flex; justify-content: space-between; margin-top: 25px; padding-top: 20px; border-top: 1px solid #444; }
        .metric-box { text-align: center; }
        .metric-val { font-size: 1.4rem; font-weight: 600; color: #ddd; }
        
        .current-file-box { background: #1a1a1a; padding: 15px; border-radius: 6px; margin-top: 20px; font-family: monospace; font-size: 0.85rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 4px solid #555; }
        
        .phase-Deskewing .current-file-box { border-left-color: #26c6da; color: #b2ebf2; }
        .phase-Cropping .current-file-box { border-left-color: #f48fb1; color: #f8bbd0; }
        
        /* Animations */
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
        .active-indicator { display: inline-block; width: 10px; height: 10px; background: #4caf50; border-radius: 50%; margin-right: 8px; animation: pulse 2s infinite; }

    </style>
</head>
<body class="petakit-body" data-host="{{ hpc_host_name }}">
    <a href="/" class="back-link" style="color:#aaa; text-decoration:none; display:inline-block; margin-bottom:10px;">&larr; Return to Home</a>
    
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
            <h1 style="color:white; margin:0; font-weight:300;">Petakit <span style="font-weight:700">Live</span></h1>
            <div style="color:#888; font-size:0.9rem; margin-top:5px;">
                Node: <span id="node-id" style="color:#fff">--</span> | 
                Job: <span id="job-id" style="color:#fff">--</span>
            </div>
        </div>
        <div id="phase-badge" style="padding: 8px 16px; background:#444; border-radius:20px; font-weight:bold; font-size:0.9rem;">Waiting...</div>
    </div>

    <div class="grid-container">
        <div>
            <h3 style="margin-top:0; color:#ccc;">Compute Load</h3>
            <div id="htop-grid" class="htop-container"></div>
        </div>
        
        <div class="stats-card">
            <div class="stat-label"><span class="active-indicator"></span>Images Processed</div>
            <div class="big-number" id="img-count">0</div>
            
            <div class="current-file-box" id="current-file">
                Waiting for logs...
            </div>

            <div class="metric-row">
                <div class="metric-box">
                    <div class="metric-val" id="last-time">-- s</div>
                    <div class="stat-label">Last Frame</div>
                </div>
                <div class="metric-box">
                    <div class="metric-val" id="phase-text">--</div>
                    <div class="stat-label">Current Phase</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const host = document.body.dataset.host;
        const grid = document.getElementById('htop-grid');
        const phaseBadge = document.getElementById('phase-badge');
        const nodeLabel = document.getElementById('node-id');
        const jobLabel = document.getElementById('job-id');
        
        // Stats Elements
        const imgCount = document.getElementById('img-count');
        const lastTime = document.getElementById('last-time');
        const currentFile = document.getElementById('current-file');
        const phaseText = document.getElementById('phase-text');

        async function update() {
            try {
                const res = await fetch(`/api/petakit/${host}`);
                const data = await res.json();

                if (data.status !== 'active') {
                    jobLabel.innerText = data.message || "No Active Job";
                    phaseBadge.style.background = "#d32f2f"; // Red
                    phaseBadge.innerText = "Offline";
                    return;
                }

                // 1. Update Header Info
                nodeLabel.innerText = data.node;
                jobLabel.innerText = data.job_id;
                
                // 2. Update Stats
                const stats = data.stats;
                
                // Animate count up if it changed? (Optional, kept simple for now)
                imgCount.innerText = stats.count;
                lastTime.innerText = stats.last_time > 0 ? `${stats.last_time.toFixed(1)}s` : "--";
                
                // Truncate file path for display
                let fileDisplay = stats.current_file;
                if(fileDisplay.length > 50) {
                    fileDisplay = "..." + fileDisplay.substring(fileDisplay.length - 50);
                }
                currentFile.innerText = fileDisplay || "Initializing...";
                
                phaseText.innerText = stats.phase;
                phaseBadge.innerText = stats.phase.toUpperCase();

                // 3. Update Visual Colors based on Phase
                grid.className = `htop-container phase-${stats.phase}`;
                
                // Badge Color Logic
                if (stats.phase === 'Deskewing') phaseBadge.style.background = "#0288d1";
                else if (stats.phase === 'Cropping') phaseBadge.style.background = "#c2185b";
                else phaseBadge.style.background = "#444";

                // 4. Render CPU Grid
                grid.innerHTML = data.cpu.map(c => `
                    <div class="core-bar">
                        <div class="core-text">${c.core}</div>
                        <div class="core-fill" style="width:${c.usage}%"></div>
                    </div>
                `).join('');

            } catch (e) { console.error(e); }
        }

        setInterval(update, 5000);
        update();
    </script>
</body>
</html>
